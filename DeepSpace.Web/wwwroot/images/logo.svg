<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ec8ff"/>
      <stop offset="100%" style="stop-color:#4a9eff"/>
    </linearGradient>
  </defs>
  
  <!-- Planet with ring -->
  <circle cx="20" cy="25" r="12" fill="url(#logoGradient)"/>
  <ellipse cx="20" cy="25" rx="20" ry="6" fill="none" stroke="#7ec8ff" stroke-width="2" opacity="0.6"/>
  
  <!-- Stars -->
  <circle cx="38" cy="12" r="1.5" fill="#fff"/>
  <circle cx="45" cy="35" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="8" cy="10" r="1" fill="#fff" opacity="0.5"/>
  
  <!-- Text -->
  <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Deep</text>
  <text x="110" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#logoGradient)">Space</text>
</svg>
